services:
  api:
    build:
      context: ./apps/api
    environment:
      DEFAULT_WHISPER_MODEL: small.en
      RUNS_DB_PATH: /app/data/runs.db
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    volumes:
      - type: bind
        source: ./apps/api/app
        target: /app/app
      - type: bind
        source: ./apps/api/models/ggml-base.en.bin
        target: /app/models/ggml-base.en.bin
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./apps/api/models/ggml-small.en.bin
        target: /app/models/ggml-small.en.bin
        read_only: true
        bind:
          create_host_path: false
      - runs-data:/app/data

  web:
    build:
      context: ./apps/web
      target: build
      args:
        VITE_API_URL: http://localhost:8001
        VITE_WHISPER_MODEL: small.en
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - type: bind
        source: ./apps/web
        target: /app
      - /app/node_modules

volumes:
  runs-data:
